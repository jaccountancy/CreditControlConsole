<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J'accountancy Diagonal Flight Loader</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      padding: 2rem;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .loader {
      width: 140px;
      height: 140px;
      background: white;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    .loader svg {
      width: 100%;
      height: 100%;
    }

    .shape-1-diagonal {
      animation: diagonal-1 3.8s ease-in-out infinite;
      transform-origin: center;
    }

    .shape-2-diagonal {
      animation: diagonal-2 3.8s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes diagonal-1 {
      0%, 100% { transform: translateX(0) translateY(0) rotate(0deg); }
      25% { transform: translateX(-50px) translateY(-30px) rotate(120deg); }
      50% { transform: translateX(0) translateY(0) rotate(240deg); }
      75% { transform: translateX(50px) translateY(30px) rotate(360deg); }
    }

    @keyframes diagonal-2 {
      0%, 100% { transform: translateX(0) translateY(0) rotate(0deg); }
      25% { transform: translateX(50px) translateY(30px) rotate(-120deg); }
      50% { transform: translateX(0) translateY(0) rotate(-240deg); }
      75% { transform: translateX(-50px) translateY(-30px) rotate(-360deg); }
    }

    .loader-text {
      text-align: center;
    }

    .loader-title {
      font-size: 18px;
      font-weight: 600;
      color: #1a3a52;
      margin-bottom: 0.5rem;
    }

    .loader-subtitle {
      font-size: 14px;
      color: #7a8fa3;
    }

    .controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 500px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .control-group label {
      font-size: 12px;
      font-weight: 600;
      color: #7a8fa3;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .control-group input {
      padding: 8px 12px;
      border: 1px solid #e0e6f2;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      background: white;
    }

    .control-group input:focus {
      outline: none;
      border-color: #2a8dcd;
      box-shadow: 0 0 0 3px rgba(42, 141, 205, 0.1);
    }

    .info {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      max-width: 500px;
      font-size: 14px;
      line-height: 1.6;
      color: #4a5f7f;
    }

    .info h3 {
      color: #1a3a52;
      margin-bottom: 1rem;
      font-size: 16px;
    }

    .info code {
      background: #f0f4f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      color: #2a8dcd;
    }

    .copy-button {
      margin-top: 1rem;
      padding: 10px 16px;
      background: #2a8dcd;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .copy-button:hover {
      background: #1f6a9b;
    }

    .copy-button.copied {
      background: #0f6e56;
    }
  </style>
</head>
<body>
  <div class="loader-container">
    <div class="loader">
      <svg viewBox="0 0 98.53 98.28" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lg1" x1="22.13" y1="22.14" x2="82.38" y2="87.41">
            <stop offset="0" stop-color="#2a8dcd"/>
            <stop offset="1" stop-color="#3e7ec1"/>
          </linearGradient>
          <linearGradient id="lg2" x1="24.15" y1="20.28" x2="84.4" y2="85.55">
            <stop offset="0" stop-color="#2a8dcd"/>
            <stop offset="1" stop-color="#3e7ec1"/>
          </linearGradient>
        </defs>
        <g class="shape-1-diagonal">
          <path fill="url(#lg1)" d="M36,59.36a7.18,7.18,0,0,1-6.06-2.63c-1.34-1.76-2-4.71-2-8.87V39.28L0,44.07,44.07,0V44.18q0,8-2,11.57A6.5,6.5,0,0,1,36,59.36Z"/>
        </g>
        <g class="shape-2-diagonal">
          <path fill="url(#lg2)" d="M98.53,53.92,54.17,98.28,36.63,80.74q16.57-.55,25.93-8.95,10.05-9,10-25.52V28Z"/>
        </g>
      </svg>
    </div>

    <div class="loader-text">
      <div class="loader-title">Processing</div>
      <div class="loader-subtitle">Fetching your accounts...</div>
    </div>
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="speed">Speed (seconds)</label>
      <input type="number" id="speed" min="1" max="10" step="0.5" value="3.8">
    </div>
    <div class="control-group">
      <label for="title">Title</label>
      <input type="text" id="title" value="Processing">
    </div>
    <div class="control-group">
      <label for="subtitle">Subtitle</label>
      <input type="text" id="subtitle" value="Fetching your accounts...">
    </div>
  </div>

  <div class="info">
    <h3>📋 Integration Guide</h3>
    <p>Copy the SVG and CSS animation code below to use in your product. The animation duration is controlled by the speed parameter above.</p>
    <button class="copy-button" onclick="copySVGCode()">Copy SVG Code</button>
  </div>

  <script>
    const titleInput = document.getElementById('title');
    const subtitleInput = document.getElementById('subtitle');
    const speedInput = document.getElementById('speed');
    const titleElement = document.querySelector('.loader-title');
    const subtitleElement = document.querySelector('.loader-subtitle');
    const animationElements = document.querySelectorAll('.shape-1-diagonal, .shape-2-diagonal');

    titleInput.addEventListener('input', (e) => {
      titleElement.textContent = e.target.value;
    });

    subtitleInput.addEventListener('input', (e) => {
      subtitleElement.textContent = e.target.value;
    });

    speedInput.addEventListener('input', (e) => {
      const duration = e.target.value + 's';
      animationElements.forEach(el => {
        if (el.classList.contains('shape-1-diagonal')) {
          el.style.animationDuration = duration;
        } else {
          el.style.animationDuration = duration;
        }
      });
    });

    function copySVGCode() {
      const svgCode = `<svg viewBox="0 0 98.53 98.28" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lg1" x1="22.13" y1="22.14" x2="82.38" y2="87.41">
      <stop offset="0" stop-color="#2a8dcd"/>
      <stop offset="1" stop-color="#3e7ec1"/>
    </linearGradient>
    <linearGradient id="lg2" x1="24.15" y1="20.28" x2="84.4" y2="85.55">
      <stop offset="0" stop-color="#2a8dcd"/>
      <stop offset="1" stop-color="#3e7ec1"/>
    </linearGradient>
  </defs>
  <g class="shape-1-diagonal">
    <path fill="url(#lg1)" d="M36,59.36a7.18,7.18,0,0,1-6.06-2.63c-1.34-1.76-2-4.71-2-8.87V39.28L0,44.07,44.07,0V44.18q0,8-2,11.57A6.5,6.5,0,0,1,36,59.36Z"/>
  </g>
  <g class="shape-2-diagonal">
    <path fill="url(#lg2)" d="M98.53,53.92,54.17,98.28,36.63,80.74q16.57-.55,25.93-8.95,10.05-9,10-25.52V28Z"/>
  </g>
</svg>

<style>
  .shape-1-diagonal {
    animation: diagonal-1 3.8s ease-in-out infinite;
    transform-origin: center;
  }

  .shape-2-diagonal {
    animation: diagonal-2 3.8s ease-in-out infinite;
    transform-origin: center;
  }

  @keyframes diagonal-1 {
    0%, 100% { transform: translateX(0) translateY(0) rotate(0deg); }
    25% { transform: translateX(-50px) translateY(-30px) rotate(120deg); }
    50% { transform: translateX(0) translateY(0) rotate(240deg); }
    75% { transform: translateX(50px) translateY(30px) rotate(360deg); }
  }

  @keyframes diagonal-2 {
    0%, 100% { transform: translateX(0) translateY(0) rotate(0deg); }
    25% { transform: translateX(50px) translateY(30px) rotate(-120deg); }
    50% { transform: translateX(0) translateY(0) rotate(-240deg); }
    75% { transform: translateX(-50px) translateY(-30px) rotate(-360deg); }
  }
</style>`;

      navigator.clipboard.writeText(svgCode).then(() => {
        const button = event.target;
        button.textContent = '✓ Copied!';
        button.classList.add('copied');
        setTimeout(() => {
          button.textContent = 'Copy SVG Code';
          button.classList.remove('copied');
        }, 2000);
      });
    }
  </script>
</body>
</html>
