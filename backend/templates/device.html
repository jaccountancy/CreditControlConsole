{% extends "base.html" %}
{% block content %}
<section class="hero-card">
    <p class="eyebrow">macOS Login</p>
    {% if approved %}
    <h2>Device approved</h2>
    <p>The app can finish signing in now.</p>
    {% else %}
    <h2>Approve a device code</h2>
    <p>If the macOS app shows a verification code, enter it here after logging in with Xero.</p>
    <form method="post" action="/device/approve" class="stack">
        <input name="verification_code" value="{{ verification_code or '' }}" placeholder="Verification code" />
        <button class="button" type="submit">Approve Device</button>
    </form>
    {% endif %}
</section>
{% endblock %}
