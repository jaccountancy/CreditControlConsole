<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Jenius Tools{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="/static/JaccountancyBlueIcon.png" as="image">
    <link rel="icon" type="image/png" href="/static/JaccountancyBlueIcon.png">
    <link rel="shortcut icon" type="image/png" href="/static/JaccountancyBlueIcon.png">
    <link rel="preload" href="/static/jACCOUNTANCYBLUEHORIZONTLE.PNG" as="image">
    <link rel="preload" href="/static/login-wallpaper-jaccountancy.png" as="image">
    <link rel="stylesheet" href="/static/styles.css">
    {% block head_extra %}{% endblock %}
</head>
<body class="auth-body">
    <main class="auth-shell">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
