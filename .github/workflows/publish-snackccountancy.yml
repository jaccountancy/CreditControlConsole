name: Publish Snackccountancy Page

on:
  push:
    branches:
      - main
    paths:
      - backend/static/SnackccountancyCheckoutout.html
      - scripts/publish_wordpress_page.py
      - .github/workflows/publish-snackccountancy.yml
  workflow_dispatch:
    inputs:
      source_file:
        description: "Repository file path to publish"
        required: false
        default: "backend/static/SnackccountancyCheckoutout.html"
      page_slug:
        description: "WordPress page slug"
        required: false
        default: "snackccountancy"

jobs:
  publish-wordpress-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate WordPress publish configuration
        id: wp_config
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL || vars.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME || vars.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD || vars.WP_APP_PASSWORD }}
        run: |
          missing=()
          [[ -z "${WP_BASE_URL}" ]] && missing+=("WP_BASE_URL")
          [[ -z "${WP_USERNAME}" ]] && missing+=("WP_USERNAME")
          [[ -z "${WP_APP_PASSWORD}" ]] && missing+=("WP_APP_PASSWORD")

          if (( ${#missing[@]} > 0 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping publish. Missing required repository Secrets/Variables: ${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish page to WordPress
        if: steps.wp_config.outputs.ready == 'true'
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL || vars.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME || vars.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD || vars.WP_APP_PASSWORD }}
          WP_PAGE_TITLE: ${{ secrets.WP_PAGE_TITLE || vars.WP_PAGE_TITLE }}
          WP_PAGE_STATUS: ${{ secrets.WP_PAGE_STATUS || vars.WP_PAGE_STATUS }}
          WP_USE_IFRAME_EMBED: ${{ secrets.WP_USE_IFRAME_EMBED || vars.WP_USE_IFRAME_EMBED }}
          WP_EMBED_SRC_URL: ${{ secrets.WP_EMBED_SRC_URL || vars.WP_EMBED_SRC_URL }}
          WP_SOURCE_FILE: ${{ github.event.inputs.source_file || 'backend/static/SnackccountancyCheckoutout.html' }}
          WP_PAGE_SLUG: ${{ github.event.inputs.page_slug || 'snackccountancy' }}
        run: |
          python scripts/publish_wordpress_page.py

      - name: Publish skipped notice
        if: steps.wp_config.outputs.ready != 'true'
        run: |
          echo "Publish skipped. Configure repo Secrets/Variables first: ${{ steps.wp_config.outputs.missing }}"
